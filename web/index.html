<!doctype html>
<html lang="en" data-input="keyboard" data-family="xbox">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="gamehub-token" content="__GAMEHUB_TOKEN__">
  <title>GameHub ArcStyle</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
    <symbol id="i-apps" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="5.5" r="2.3"/><circle cx="12" cy="5.5" r="2.3"/><circle cx="18.5" cy="5.5" r="2.3"/><circle cx="5.5" cy="12" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="18.5" cy="12" r="2.3"/><circle cx="5.5" cy="18.5" r="2.3"/><circle cx="12" cy="18.5" r="2.3"/><circle cx="18.5" cy="18.5" r="2.3"/></g></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z" fill="currentColor"/></symbol>
    <symbol id="i-star-o" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10.5v6M12 7.2v.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M7 6.3a7.5 7.5 0 1 0 10 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.6 9.6 0 0 1 12 6c5 0 9 6 9 6a16 16 0 0 1-2.6 3.1M6.4 7.6A15.8 15.8 0 0 0 3 12s4 6 9 6a8.6 8.6 0 0 0 3.7-.8M9.9 10a3 3 0 0 0 4.1 4.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M7.5 7h9a5 5 0 0 1 4.9 6l-.8 4a2.6 2.6 0 0 1-4.5 1.2L14 16h-4l-2.1 2.2A2.6 2.6 0 0 1 3.4 17l-.8-4A5 5 0 0 1 7.5 7z" fill="currentColor"/><path d="M8 10v4M6 12h4" stroke="var(--bg-0)" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="11" r="1.1" fill="var(--bg-0)"/><circle cx="17.8" cy="13" r="1.1" fill="var(--bg-0)"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.3a9.5 9.5 0 0 1 13 0M8.6 15.5a5 5 0 0 1 6.8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-ethernet" viewBox="0 0 24 24"><path d="M5 4h14v11h-3v3h-2v2h-4v-2H8v-3H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8v3M12 8v3M15 8v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="M3 3l18 18M8.6 15.5a5 5 0 0 1 6.8 0M5.5 12.3a9.5 9.5 0 0 1 4-2.2M2.5 9a14 14 0 0 1 4.1-2.6M14.5 10a9.5 9.5 0 0 1 4 2.3M12 5a14 14 0 0 1 9.5 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v3M8 20h8M9 20l1-3h4l1 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <!-- Dynamic background -->
  <div id="bg" aria-hidden="true">
    <div class="bg-aurora"></div>
    <div class="bg-layer" id="bg-a"></div>
    <div class="bg-layer" id="bg-b"></div>
    <div class="bg-shade"></div>
    <div class="bg-grain"></div>
  </div>

  <!-- Boot splash -->
  <div id="boot">
    <div class="boot-logo">
      <svg class="boot-arc" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="80" class="arc-track"/>
        <circle cx="100" cy="100" r="80" class="arc-fill"/>
      </svg>
      <div class="boot-word">GAME<b>HUB</b></div>
      <div class="boot-sub">ARC STYLE</div>
    </div>
    <div class="boot-press"><span class="boot-press-text">Press any button</span></div>
  </div>

  <div id="app">
    <header class="topbar">
      <nav class="tabs" data-row>
        <span class="tab-glyph" data-glyph="lb"></span>
        <button class="tab" data-nav data-tab="home"><svg><use href="#i-home"/></svg><span>Home</span></button>
        <button class="tab" data-nav data-tab="library"><svg><use href="#i-gamepad"/></svg><span>Games</span></button>
        <button class="tab" data-nav data-tab="apps"><svg><use href="#i-apps"/></svg><span>Apps</span></button>
        <button class="tab" data-nav data-tab="settings"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
        <span class="tab-glyph" data-glyph="rb"></span>
      </nav>
      <div class="status">
        <div class="now-playing" id="now-playing" hidden><span class="np-dot"></span><span class="np-text"></span></div>
        <span class="status-icon" id="pad-status" title="Controller"><svg><use href="#i-gamepad"/></svg></span>
        <span class="status-icon" id="net-status"><svg><use href="#i-wifi"/></svg></span>
        <span class="battery" id="battery" hidden><span class="battery-body"><span class="battery-fill"></span></span><span class="battery-text"></span></span>
        <div class="clock"><span id="clock-time">--:--</span><span id="clock-date"></span></div>
        <button class="power-btn" data-nav id="power-btn" aria-label="Menu"><svg><use href="#i-power"/></svg></button>
      </div>
    </header>

    <main>
      <!-- HOME -->
      <section class="view" id="view-home">
        <div class="rail-wrap" data-no-scroll>
          <div class="rail" id="rail" data-row data-row-trap></div>
        </div>
        <div class="spotlight" id="spotlight">
          <div class="spot-logo" id="spot-logo"></div>
          <div class="spot-meta" id="spot-meta"></div>
          <div class="spot-actions" data-row>
            <button class="btn btn-primary" data-nav data-nav-default id="spot-play"><svg><use href="#i-play"/></svg><span>Play</span></button>
            <button class="btn btn-icon" data-nav id="spot-fav" aria-label="Favorite"><svg><use href="#i-star-o"/></svg></button>
            <button class="btn btn-icon" data-nav id="spot-info" aria-label="Details"><svg><use href="#i-info"/></svg></button>
          </div>
          <div class="spot-cards" id="spot-cards"></div>
        </div>
      </section>

      <!-- LIBRARY -->
      <section class="view" id="view-library" hidden>
        <div class="lib-head">
          <div class="lib-title">
            <h1 id="lib-heading">Games</h1>
            <span class="lib-count" id="lib-count"></span>
          </div>
          <div class="lib-tools" data-row>
            <label class="search" data-nav id="search-box">
              <svg><use href="#i-search"/></svg>
              <input id="search" type="text" placeholder="Search games" aria-label="Search games" autocomplete="off" spellcheck="false" maxlength="60">
            </label>
            <button class="btn btn-ghost" data-nav id="sort-btn"><svg><use href="#i-sort"/></svg><span id="sort-label">A–Z</span></button>
            <button class="btn btn-ghost" data-nav id="lib-add"><svg><use href="#i-plus"/></svg><span>Add game</span></button>
          </div>
        </div>
        <div class="chips" id="chips" data-row></div>
        <div class="grid-scroll" id="grid-scroll">
          <div class="grid" id="grid"></div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section class="view" id="view-settings" hidden>
        <div class="settings-layout">
          <aside class="settings-side">
            <h1>Settings</h1>
            <p class="settings-help" id="settings-help">Customize how GameHub looks, sounds and finds your games.</p>
            <div class="settings-about" id="settings-about"></div>
          </aside>
          <div class="settings-list" id="settings-list"></div>
        </div>
      </section>
    </main>

  </div>

  <footer class="hints" id="hints"></footer>

  <!-- Game details -->
  <div class="overlay" id="details" role="dialog" aria-modal="true">
    <div class="details-bg" id="details-bg"></div>
    <div class="details-body">
      <div class="details-main">
        <div class="details-logo" id="details-logo"></div>
        <div class="details-chips" id="details-chips"></div>
        <p class="details-desc" id="details-desc" hidden></p>
        <div class="details-actions" data-row id="details-actions"></div>
        <div class="details-stats" id="details-stats"></div>
      </div>
      <div class="details-cover" id="details-cover"></div>
    </div>
  </div>

  <!-- Power / quick menu -->
  <div class="overlay" id="power" role="dialog" aria-modal="true">
    <div class="power-panel">
      <div class="power-head"><div class="power-name">GameHub</div></div>
      <div class="power-list" id="power-list"></div>
    </div>
  </div>

  <!-- Add custom game -->
  <div class="overlay" id="addgame" role="dialog" aria-modal="true">
    <div class="dialog">
      <h2>Add a game</h2>
      <p class="dialog-sub">Add anything you can start with a command — emulators, itch.io games, scripts or AppImages.</p>
      <div class="form">
        <label class="field" data-nav><span>Title</span><input id="ag-title" type="text" aria-label="Title" maxlength="120" autocomplete="off"></label>
        <label class="field" data-nav><span>Launch command</span><input id="ag-command" type="text" aria-label="Launch command" placeholder="e.g. retroarch -L core.so ~/roms/game.sfc" autocomplete="off" spellcheck="false"></label>
        <label class="field" data-nav><span>Cover image URL <em>optional, portrait</em></span><input id="ag-cover" type="text" aria-label="Cover image URL" placeholder="https://…" autocomplete="off" spellcheck="false"></label>
        <label class="field" data-nav><span>Background image URL <em>optional, wide</em></span><input id="ag-hero" type="text" aria-label="Background image URL" placeholder="https://…" autocomplete="off" spellcheck="false"></label>
      </div>
      <div class="dialog-actions" data-row>
        <button class="btn btn-primary" data-nav data-nav-default id="ag-save"><svg><use href="#i-plus"/></svg><span>Add game</span></button>
        <button class="btn btn-ghost" data-nav id="ag-cancel"><span>Cancel</span></button>
      </div>
    </div>
  </div>

  <!-- Confirm -->
  <div class="overlay" id="confirm" role="alertdialog" aria-modal="true">
    <div class="dialog small">
      <h2 id="confirm-title"></h2>
      <p class="dialog-sub" id="confirm-text"></p>
      <div class="dialog-actions" data-row>
        <button class="btn btn-primary" data-nav id="confirm-yes" data-nav-default></button>
        <button class="btn btn-ghost" data-nav id="confirm-no">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Launch animation -->
  <div id="launching" aria-live="polite">
    <div class="launch-bg" id="launch-bg"></div>
    <div class="launch-center">
      <div class="launch-ring"><div class="launch-cover" id="launch-cover"></div></div>
      <div class="launch-title" id="launch-title"></div>
      <div class="launch-sub" id="launch-sub">Starting game…</div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
